services:
  pubsub-emulator:
    # Source of truth for the emulator image pin (tracked by Dependabot). Keep the copies in
    # .github/workflows/elixir.yml, dev/mix/tasks/emulator.start.ex and test/test_helper.exs in sync.
    image: google/cloud-sdk:592.0.0-emulators@sha256:808708b26bdf6705e2b42ed48ab53ad4abe0ce171ec8e78074669d28f5cb8dcc
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=my-project-id
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - PUBSUB_PROJECT_ID=my-project-id
